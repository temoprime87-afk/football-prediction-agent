name: FPL Prediction Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run agent
        run: |
          python main.py

      - name: Save FPL data
        uses: actions/upload-artifact@v4
        with:
          name: fpl-data
          path: fpl_data.json
